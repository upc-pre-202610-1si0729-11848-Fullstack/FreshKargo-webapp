<section id="contact" class="contact-section" aria-labelledby="contact-title">
  <div class="section-container contact-container">
    <div class="section-heading">
      <h2 id="contact-title" class="section-title" data-i18n="contact.title">Agenda tu demo personalizada</h2>
      <p class="section-subtitle" data-i18n="contact.subtitle">Sin compromiso · Te respondemos en minutos</p>
    </div>
    <form class="demo-form" data-demo-form>
      <label for="full-name" data-i18n="contact.name">Nombre completo</label>
      <input id="full-name" name="fullName" type="text" required data-i18n-placeholder="contact.name.placeholder" placeholder="Tu nombre completo" />
      <label for="email" data-i18n="contact.email">Correo electrónico</label>
      <input id="email" name="email" type="email" required data-i18n-placeholder="contact.email.placeholder" placeholder="tu@correo.com" />
      <label for="phone" data-i18n="contact.phone">Teléfono / WhatsApp</label>
      <input id="phone" name="phone" type="tel" required data-i18n-placeholder="contact.phone.placeholder" placeholder="999 888 777" />
      <button class="primary-button form-button" type="submit"><span data-i18n="contact.submit">Agendar demostración</span> →</button>
      <p class="form-disclaimer" data-i18n="contact.disclaimer">Al enviar serás redirigido a WhatsApp para coordinar tu demo personalizada.</p>
      <div class="contact-benefits">
        <span>✓ <b data-i18n="contact.benefit1">Sin Compromiso</b></span>
        <span>✓ <b data-i18n="contact.benefit2">Respuesta Inmediata</b></span>
        <span>✓ <b data-i18n="contact.benefit3">Soporte Personalizado</b></span>
      </div>
    </form>
  </div>
</section>
