<div
  class="sidebar"
  [class.sidebar-collapsed]="isCollapsed === true">

  <div class="logo-section">

    <div class="logo">
      <h1 class="logo-text">
        FreshKargo
      </h1>
    </div>

    <button
      class="toggle-btn"
      (click)="toggleSidebar()">

      <span class="material-symbols-outlined">
        {{ isCollapsed ? 'chevron_right' : 'chevron_left' }}
      </span>

    </button>

  </div>

  <div class="menu">

    <a
      class="menu-item"
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }">

      <span class="material-symbols-outlined">
        dashboard
      </span>

      <span class="menu-text">
        Dashboard
      </span>

    </a>

    <a
      class="menu-item"
      routerLink="/inventory"
      routerLinkActive="active-link">

      <span class="material-symbols-outlined">
        inventory_2
      </span>

      <span class="menu-text">
        Inventory
      </span>

    </a>

    <a
      class="menu-item"
      routerLink="/shipments"
      routerLinkActive="active-link">

      <span class="material-symbols-outlined">
        local_shipping
      </span>

      <span class="menu-text">
        Shipments
      </span>

    </a>

    <a
      class="menu-item"
      routerLink="/analytics"
      routerLinkActive="active-link">

      <span class="material-symbols-outlined">
        analytics
      </span>

      <span class="menu-text">
        Analytics
      </span>

    </a>

    <a class="menu-item">

      <span class="material-symbols-outlined">
        apartment
      </span>

      <span class="menu-text">
        Suppliers
      </span>

    </a>

    <a class="menu-item">

      <span class="material-symbols-outlined">
        notifications
      </span>

      <span class="menu-text">
        Alerts
      </span>

    </a>

    <a class="menu-item">

      <span class="material-symbols-outlined">
        group
      </span>

      <span class="menu-text">
        Users & Roles
      </span>

    </a>

    <a class="menu-item">

      <span class="material-symbols-outlined">
        hub
      </span>

      <span class="menu-text">
        Integrations
      </span>

    </a>

  </div>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-bottom">

    <button class="bottom-link">

      <span class="material-symbols-outlined">
        settings
      </span>

      <span class="bottom-text">
        Settings
      </span>

    </button>

    <button class="bottom-link">

      <span class="material-symbols-outlined">
        help
      </span>

      <span class="bottom-text">
        Help
      </span>

    </button>

    <button class="bottom-link">

      <span class="material-symbols-outlined">
        logout
      </span>

      <span class="bottom-text">
        Back to Landing
      </span>

    </button>

    <div class="profile-card">

      <div class="profile-avatar">
        FB
      </div>

      <div class="profile-info">

        <h4>User</h4>

        <p>Operations Manager</p>

      </div>

    </div>

  </div>

</div>
