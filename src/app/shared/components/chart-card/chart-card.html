<div class="chart-card">

  <div class="chart-header">

    <div>
      <h2>Operations Analytics</h2>
      <p>Shipment performance over the last 6 months</p>
    </div>

    <button class="period-btn">
      Monthly
    </button>

  </div>

  <div class="chart-container">

    <canvas
      baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType">
    </canvas>

  </div>

  <div class="chart-footer">

    <div class="legend-item">
      <span class="dot"></span>
      Shipment Growth
    </div>

    <span class="growth-text">
      +18.2%
    </span>

  </div>

</div>
