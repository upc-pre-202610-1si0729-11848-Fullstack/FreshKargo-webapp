<div class="stats-card">

  <div class="card-top">

    <div class="icon-container">
      <span class="material-symbols-outlined">
        {{ icon() }}
      </span>
    </div>

    <span class="trend positive">
      +12.4%
    </span>

  </div>

  <div class="card-content">

    <p>{{ title() }}</p>

    <h2>{{ value() }}</h2>

    <span class="card-footer">
      Updated 5 min ago
    </span>

  </div>

</div>
